[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rgcn-imputation"
version = "0.1.0"
description = "Multi-relational R-GCN imputation for production time series"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Stelina Naka"}]
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "torch_geometric>=2.4", "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3"]

[tool.setuptools]
packages = ["rgcn_imputer"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning", "ignore::DeprecationWarning"]
